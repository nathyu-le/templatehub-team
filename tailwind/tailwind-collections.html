<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tailwind Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white p-6">

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

    <a href="#" class="group relative block overflow-hidden rounded-xl border border-gray-200">
      <img src="/uploads/bst1.jpg" alt="Luxurious style collection" loading="lazy"
decoding="async" class="w-full h-[210px] object-cover transition duration-300 group-hover:scale-105">
      <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/30 to-transparent"></div>
      <div class="absolute left-4 bottom-4 text-white">
        <div class="font-extrabold tracking-wide">LUXURIOUS STYLE</div>
        <div class="text-sm opacity-90">fashionable and elegant</div>
      </div>
    </a>

    <a href="#" class="group relative block overflow-hidden rounded-xl border border-gray-200">
      <img src="/uploads/bst2.jpg" alt="Sp style collection" loading="lazy"
decoding="async" class="w-full h-[210px] object-cover transition duration-300 group-hover:scale-105">
      <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/30 to-transparent"></div>
      <div class="absolute left-4 bottom-4 text-white">
        <div class="font-extrabold tracking-wide">SPORT STYLE</div>
        <div class="text-sm opacity-90">dynamic and individualistic</div>
      </div>
    </a>

    <a href="#" class="group relative block overflow-hidden rounded-xl border border-gray-200">
      <img src="/uploads/bst3.jpg" alt="Hiphop style collection" loading="lazy"
decoding="async" class="w-full h-[210px] object-cover transition duration-300 group-hover:scale-105">
      <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/30 to-transparent"></div>
      <div class="absolute left-4 bottom-4 text-white">
        <div class="font-extrabold tracking-wide">STREET STYLE</div>
        <div class="text-sm opacity-90">hip hop and cool</div>
      </div>
    </a>

  </div>

</body>
</html>
